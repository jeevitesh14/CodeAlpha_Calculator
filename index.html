
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeAlpha Calculator</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">

        <!-- Calculator Header -->
        <div class="header">
            <h2>Calculator</h2>
            <p>CodeAlpha Internship Project</p>
        </div>

        <!-- Display Screen -->
        <div class="display">
            <div id="previous-operand"></div>
            <div id="current-operand">0</div>
        </div>

        <!-- Calculator Buttons -->
        <div class="buttons">

            <button class="operator clear" data-action="clear">AC</button>
            <button class="operator" data-action="delete">DEL</button>
            <button class="operator" data-operation="%">%</button>
            <button class="operator" data-operation="÷">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operation="×">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operation="-">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operation="+">+</button>

            <button data-action="sign">+/-</button>
            <button data-number="0">0</button>
            <button data-action="decimal">.</button>
            <button class="operator equals" data-action="equals">=</button>

        </div>

        <!-- Footer -->
        <div class="footer">
            Built with HTML, CSS & JavaScript
        </div>

    </div>

    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>
</html>
